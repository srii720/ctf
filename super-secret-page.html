<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Found! — Beginner CTF</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-grid"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="secret-wrapper">
    <h1 class="glow-text">🎉 You Found the Secret Page!</h1>
    <p style="color:var(--text-dim)">Nice work checking <code style="color:var(--gold)">robots.txt</code>! Here's your reward:</p>
    <div class="flag-box" style="user-select:all; cursor:pointer;" onclick="navigator.clipboard.writeText('FLAG{robots_txt_is_public}'); alert('Flag copied to clipboard!');" title="Click to copy">FLAG{robots_txt_is_public}</div>
    <br>
    <a href="/" class="breadcrumb-link" style="color:var(--accent);font-size:1rem;font-weight:bold;">→ Return to CTF Challenges and Submit Flag</a>
  </div>

  <script src="/static/confetti.js"></script>
  <script>
    if (window.launchConfetti) window.launchConfetti();
  </script>
</body>
</html>
