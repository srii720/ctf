[[headers]]
  for = "/*"
  [headers.values]
    X-Secret-Flag = "FLAG{check_your_headers}"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/super-secret-page"
  to = "/super-secret-page.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
